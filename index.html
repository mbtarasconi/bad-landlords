<!DOCTYPE html>
<html lang="pt-BR">
<head><meta name="description" content="Monopoly sem freio pra jogar com os amigos: casas da sua cidade, cartas com os podres do grupo, tribunal, maldições e falência com estilo."><meta property="og:title" content="Bad Landlords"><meta property="og:description" content="Monopoly sem freio pra jogar com os amigos. Cria a sala, manda o código e que vença o pior."><meta property="og:type" content="website"><meta name="theme-color" content="#5BBDF0"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>(function(){
  if (window.claude && window.claude.use) return;
  var LS = window.localStorage;
  function lsGet(k){ try { return LS.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { LS.setItem(k, v); } catch(e){} }
  var uid = lsGet('bl_site_uid');
  if (!uid){ uid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); lsSet('bl_site_uid', uid); }
  var tabId = uid + '-' + Math.random().toString(36).slice(2, 7);
  function post(path, body){
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: false }).then(function(r){ if (!r.ok && r.status !== 204) throw new Error('http ' + r.status); });
  }
  function channel(ch){
    var handlers = {}, peerFns = [], lastPeers = [], closed = false, presence = null;
    var es = new EventSource('/rt/sse?ch=' + encodeURIComponent(ch) + '&id=' + encodeURIComponent(tabId));
    es.addEventListener('msg', function(e){ var m; try { m = JSON.parse(e.data); } catch(x){ return; } (handlers[m.topic] || []).forEach(function(f){ try { f(m.data); } catch(x){} }); });
    es.addEventListener('peers', function(e){ try { lastPeers = JSON.parse(e.data); } catch(x){ return; } peerFns.forEach(function(f){ try { f(lastPeers); } catch(x){} }); });
    es.addEventListener('open', function(){ if (presence) post('/rt/presence', { ch: ch, id: tabId, presence: presence }).catch(function(){}); });
    var api = {
      emit: function(topic, data){ return post('/rt/emit', { ch: ch, id: tabId, topic: topic, data: data }); },
      on: function(topic, fn){ (handlers[topic] = handlers[topic] || []).push(fn); return function(){ handlers[topic] = (handlers[topic] || []).filter(function(f){ return f !== fn; }); }; },
      presence: function(p){ presence = Object.assign({}, presence || {}, p || {}); return post('/rt/presence', { ch: ch, id: tabId, presence: presence }).catch(function(){}); },
      onPeers: function(fn){ peerFns.push(fn); if (lastPeers.length) fn(lastPeers); },
      leave: function(){ if (closed) return; closed = true; es.close(); post('/rt/leave', { ch: ch, id: tabId }).catch(function(){}); }
    };
    return api;
  }
  var lobby = null;
  var room = function(){
    if (!lobby){ lobby = channel('lobby'); lobby.join = function(name){ return Promise.resolve(channel(String(name).toLowerCase())); }; }
    return lobby;
  };
  var db = {
    collection: function(path){
      return { doc: function(name){
        var key = 'bl_db:' + path + '/' + name;
        return {
          get: function(){ var v = lsGet(key); return Promise.resolve(v ? JSON.parse(v) : null); },
          set: function(v){ lsSet(key, JSON.stringify(v)); return Promise.resolve(); },
          'delete': function(){ try { LS.removeItem(key); } catch(e){} return Promise.resolve(); }
        };
      } };
    }
  };
  var user = { id: function(){ return Promise.resolve(uid); } };
  var caps = { room: room, db: function(){ return db; }, user: function(){ return user; } };
  window.claude = { use: function(name){ return new Promise(function(res){ setTimeout(function(){ res(caps[name] ? caps[name]() : null); }, 0); }); } };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Landlords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bangers&family=Baloo+2:wght@500;700;800&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2730; --cream:#FFF6E3; --paper:#FFFBF1; --sky1:#6CC6F2; --sky2:#BFEAFF;
  --grass:#8CCB5E; --grass2:#6FB04A; --road:#7D8590; --brick:#C8553D; --red:#E2504B;
  --yellow:#FFD23F; --teal:#3BB3A6; --blue:#3D8BEA; --pink:#F59AB8; --purple:#8F6BD8; --green:#7BC043;
  --u:7px; --sh:0 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#CDEFFF}
body{min-height:100vh;background:linear-gradient(#5BBDF0 0%,#9FDCFA 600px,#CDEFFF 100%);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-weight:500;font-size:16px;line-height:1.4;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95;animation:cloud linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:150%;left:14%;bottom:20%}
.cloud:after{width:40%;height:120%;right:12%;bottom:25%}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.skyline{position:fixed;left:0;right:0;bottom:0;width:100%;height:150px;pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:7px 14px;font-weight:800;box-shadow:var(--sh);transition:transform .07s,box-shadow .07s;margin-bottom:4px}
button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh)}
button.big{font-family:'Bangers',cursive;font-weight:400;font-size:24px;letter-spacing:1.2px;padding:6px 20px}
button.go{background:var(--green)}
button.bad{background:var(--red);color:#fff}
button.purple{background:var(--purple);color:#fff}
button.yellow{background:var(--yellow)}
button.ghostbtn{background:rgba(255,255,255,.7);box-shadow:none;border-style:dashed;margin:0}
input,select,textarea{border:3px solid var(--ink);border-radius:12px;padding:7px 10px;background:#fff;width:100%;min-width:0}
label{font-weight:800;font-size:14px;display:block;margin:8px 0 3px}
h1,h2,h3{font-family:'Bangers',cursive;font-weight:400;letter-spacing:1px;margin:0 0 8px;line-height:1.05}
h2{font-size:30px} h3{font-size:23px}
.muted{opacity:.72;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:var(--red);font-weight:800;font-size:14px;margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
.home,.lobby,.game{position:relative;z-index:1}

/* panels: cream card with a colored folder-tab header */
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 rgba(43,39,48,.85);position:relative}
.panel>.hd{background:var(--brick);color:#fff;border-bottom:3px solid var(--ink);border-radius:14px 14px 0 0;padding:6px 14px 4px;font-family:'Bangers',cursive;font-size:24px;letter-spacing:1.2px;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>.hd.teal{background:var(--teal)}.panel>.hd.blue{background:var(--blue)}.panel>.hd.yellow{background:var(--yellow);color:var(--ink);-webkit-text-stroke:0;text-shadow:none}.panel>.hd.purple{background:var(--purple)}
.panel>.bd{padding:12px 14px 14px}
.clip{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:70px;height:34px;z-index:3;pointer-events:none}

/* home */
.home{max-width:1020px;margin:0 auto;padding:30px 16px 190px;display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:start}
.logo{position:relative;padding-top:10px}
.logo .l1,.logo .l2{display:block;font-family:'Luckiest Guy',cursive;color:var(--yellow);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);line-height:.9}
.logo .l1{font-size:104px;transform:rotate(-5deg)}
.logo .l2{font-size:84px;transform:rotate(2deg) translateX(26px);color:#fff}
.logo .stamp{position:absolute;right:6px;top:4px;background:var(--red);color:#fff;font-family:'Bangers',cursive;font-size:24px;letter-spacing:1px;padding:4px 12px;border:3px solid var(--ink);border-radius:10px;transform:rotate(12deg);box-shadow:var(--sh)}
.pitch{margin-top:26px;background:rgba(255,251,241,.92);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 rgba(43,39,48,.85);max-width:48ch}
.pitch p{margin:0 0 8px}.pitch p:last-child{margin:0}
.pitch b{font-weight:800}
.rooms{margin-top:12px}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin-top:6px}

/* lobby */
.lobby{max-width:1180px;margin:0 auto;padding:22px 14px 190px}
.lobbytop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lobbytop h2{font-size:40px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0}
.code{font-family:'Luckiest Guy',cursive;font-size:46px;letter-spacing:6px;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:4px 16px 0;box-shadow:var(--sh);display:inline-block}
.lgrid{display:grid;grid-template-columns:1fr 1.1fr 300px;gap:22px;align-items:start}
.seat{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.seat .meta{flex:1;min-width:0}
.seat .meta b{display:block;font-size:17px}
.seat .meta>span{font-size:13px;opacity:.75;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;background:#fff;position:relative}
.pieces{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pieces button{padding:4px;font-size:24px;border-radius:12px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.pieces button.sel{background:var(--yellow);border-width:3px}
.badge{display:inline-block;font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:8px;padding:0 6px;background:var(--yellow);margin-left:5px;vertical-align:2px;line-height:1.5}
.postits{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.postit{font-family:'Gochi Hand',cursive;font-size:19px;line-height:1.15;background:#FFF27A;border:2px solid #B89A00;padding:12px 10px 10px;width:172px;box-shadow:0 3px 0 rgba(0,0,0,.25);position:relative}
.postit:before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.postit small{display:block;font-family:'Baloo 2';font-size:11px;font-weight:800;opacity:.7;margin-bottom:2px}
.postit .x{position:absolute;top:-10px;right:-10px;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;box-shadow:none;border-width:2px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:3px 12px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.chips button.sel{background:var(--ink);color:var(--yellow)}

/* game layout */
.game{display:grid;grid-template-columns:auto minmax(320px,410px);gap:18px;padding:12px;justify-content:center;align-items:start}
.boardwrap{position:relative}
.board{position:relative;display:grid;grid-template-columns:1.55fr repeat(9,1fr) 1.55fr;grid-template-rows:1.55fr repeat(9,1fr) 1.55fr;gap:calc(var(--u)*.4);background:radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 2px) 0 0/14px 14px,var(--grass);border:5px solid var(--ink);border-radius:24px;padding:calc(var(--u)*.7);box-shadow:0 10px 0 #3E6B2A,0 10px 0 5px var(--ink)}

/* tiles = city lots */
.tile{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;font-size:calc(var(--u)*1.12);line-height:1.05;min-width:0;min-height:0;cursor:pointer;transition:transform .12s}
.tile:hover{transform:translateY(-2px);z-index:2}
.tile .bld{flex:1 1 52%;min-height:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#CFF0FF 0 70%,#9AD36E 70%);border-bottom:2px solid var(--ink);position:relative}
.tile .bld svg{width:92%;height:96%;display:block}
.tile .nm{padding:calc(var(--u)*.3) calc(var(--u)*.35) 0;font-weight:800;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;hyphens:auto}
.tile .pr{margin-top:auto;padding:0 calc(var(--u)*.3) calc(var(--u)*.25);display:flex;justify-content:space-between;align-items:center;gap:2px}
.tile .price{background:var(--yellow);border:1.5px solid var(--ink);border-radius:6px;padding:0 3px;font-weight:800;font-size:calc(var(--u)*1.05);white-space:nowrap}
.tile .price.rent{background:var(--red);color:#fff}
.tile .lv{font-size:calc(var(--u)*1.05);letter-spacing:-1px;white-space:nowrap}
.tile.ori-l,.tile.ori-r{flex-direction:row}
.tile.ori-l .bld,.tile.ori-r .bld{flex:0 0 42%;border-bottom:0;border-right:2px solid var(--ink)}
.tile.ori-l .txt,.tile.ori-r .txt{flex:1;display:flex;flex-direction:column;min-width:0}
.tile .txt{display:flex;flex-direction:column;flex:1 1 48%;min-height:0}
.tile .own{position:absolute;right:2px;top:2px;width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*1.3);z-index:2}
.tile .mod{position:absolute;left:2px;top:2px;font-size:calc(var(--u)*1.05);background:var(--purple);color:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:0 3px;font-weight:800;z-index:2}
.tile .hot{position:absolute;left:50%;top:2px;transform:translateX(-50%) rotate(-6deg);font-family:'Bangers',cursive;letter-spacing:.5px;font-size:calc(var(--u)*1.3);background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 4px;white-space:nowrap;z-index:2}
.tile.owned{box-shadow:inset 0 0 0 3px var(--oc)}
.tile.special{align-items:center;justify-content:center;text-align:center;padding:2px}
.tile.special .ic{width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.2);line-height:1;box-shadow:0 2px 0 var(--ink)}
.tile.special .nm{text-align:center;padding:3px 2px 0;-webkit-line-clamp:2;font-size:calc(var(--u)*1.1)}
.tile.corner .ic{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);font-size:calc(var(--u)*3.6)}
.tile.corner .nm{font-family:'Bangers',cursive;font-weight:400;letter-spacing:.6px;font-size:calc(var(--u)*1.7)}
.tile.corner .sub{font-size:calc(var(--u)*1.02);opacity:.8;padding:0 4px;font-weight:700}
.tile.t-chance{background:repeating-linear-gradient(45deg,#4FA3F0 0 6px,#3D8BEA 6px 12px);color:#fff}
.tile.t-chance .nm{text-shadow:0 1px 0 var(--ink)}
.tile.t-curse{background:#B79CF0}.tile.t-tribunal{background:var(--yellow)}.tile.t-tax{background:#FFB3A7}
.tile.t-start{background:var(--green)}.tile.t-jail{background:var(--pink)}.tile.t-fofoca{background:#FF9E4A}.tile.t-uber{background:#8FD8FF}
.tile.t-vice .bld{background:linear-gradient(#3B2A55 0 70%,#2B2236 70%)}
.tile.t-vice{background:#2B2236;color:#FFE1F0}
.tile.pick{outline:4px solid var(--red);outline-offset:-1px;animation:pickp .7s infinite alternate;z-index:3}
.tile.nopick{filter:grayscale(.8) brightness(.85)}
@keyframes pickp{to{transform:translateY(-4px)}}
.tile .crack{position:absolute;inset:0;pointer-events:none;z-index:3}
.tile .tstamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-16deg);border:3px solid var(--red);color:var(--red);font-family:'Bangers',cursive;letter-spacing:.6px;font-size:calc(var(--u)*1.6);padding:0 5px;background:rgba(255,255,255,.92);white-space:nowrap;animation:stampin .35s ease-out;z-index:4}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-16deg) scale(3);opacity:0}}

/* center: a park with a road around it */
.center{grid-row:2/11;grid-column:2/11;position:relative;margin:calc(var(--u)*1.5);border:calc(var(--u)*1.5) solid var(--road);border-radius:18px;overflow:visible;box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 2.5px var(--ink)}
.center:before{content:"";position:absolute;inset:calc(var(--u)*-0.95);border:2px dashed #fff;border-radius:22px;pointer-events:none}
.scene{position:absolute;inset:0;border-radius:4px;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.bill{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:44%;text-align:center;pointer-events:none}
.bill .face{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:calc(var(--u)*.6) calc(var(--u)*1) calc(var(--u)*.3);box-shadow:0 4px 0 var(--ink);position:relative}
.bill .face:after{content:attr(data-tag);position:absolute;right:4%;bottom:calc(var(--u)*-3.2);z-index:2;font-family:'Gochi Hand',cursive;color:var(--red);font-size:calc(var(--u)*1.6);transform:rotate(-8deg);white-space:nowrap}
.bill .a{display:block;font-family:'Luckiest Guy',cursive;font-size:calc(var(--u)*4.4);line-height:.9;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.bill .legs{display:flex;justify-content:space-around;width:60%;margin:0 auto}
.bill .legs i{display:block;width:calc(var(--u)*.8);height:calc(var(--u)*2.6);background:#8A6A4A;border:2px solid var(--ink);border-top:0}
.tower{position:absolute;right:3%;top:3%;width:calc(var(--u)*10);text-align:center;pointer-events:none}
.tower .roof{width:0;height:0;margin:0 auto;border-left:calc(var(--u)*5.4) solid transparent;border-right:calc(var(--u)*5.4) solid transparent;border-bottom:calc(var(--u)*3.4) solid var(--brick);filter:drop-shadow(0 -2.5px 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(2px 0 0 var(--ink))}
.tower .body{background:#E7B07A;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 6px 6px;padding:calc(var(--u)*.6) 0 calc(var(--u)*.7)}
.tower .clock{display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:10px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:calc(var(--u)*2.3);padding:0 6px;line-height:1.2}
.tower.low .clock{background:var(--red);color:#fff;animation:pickp .5s infinite alternate}
.broke{position:absolute;left:3%;top:5%;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:calc(var(--u)*.3) calc(var(--u)*.8);font-weight:800;font-size:calc(var(--u)*1.35);max-width:24%;line-height:1.15;box-shadow:0 3px 0 var(--ink)}
.broke b{display:block;font-family:'Bangers',cursive;font-weight:400;letter-spacing:.6px;color:var(--red);font-size:calc(var(--u)*1.6)}
.dice{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:calc(var(--u)*1.6);z-index:2}
.die{width:calc(var(--u)*7.4);height:calc(var(--u)*7.4);background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--u)*.8);transition:background .2s}
.die i{width:calc(var(--u)*1.4);height:calc(var(--u)*1.4);border-radius:50%;background:var(--ink);place-self:center}
.die.rolling{animation:roll2 .14s infinite}
.die.dbl{background:var(--yellow)}
@keyframes roll2{0%{transform:rotate(-24deg) translateY(-10px)}50%{transform:rotate(18deg) translateY(4px)}100%{transform:rotate(-6deg) translateY(-6px)}}
.dblsticker{position:absolute;left:50%;bottom:100%;margin-bottom:10px;transform:translateX(-50%) rotate(-6deg);font-family:'Bangers',cursive;letter-spacing:1px;font-size:calc(var(--u)*2.2);background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 10px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.narr{position:absolute;left:5%;right:5%;bottom:4%;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:calc(var(--u)*.8) calc(var(--u)*1.4);font-weight:800;font-size:calc(var(--u)*1.75);line-height:1.2;box-shadow:0 5px 0 var(--ink);text-align:center;z-index:3}
.narr:after{content:"";position:absolute;left:16%;top:-15px;border:11px solid transparent;border-bottom-color:var(--ink);border-top:0}
.narr.big{background:var(--yellow)} .narr.bad{background:#FFD9D6} .narr.good{background:#E1F6C8}

.ev-good .evhd{background:var(--green)}.ev-bad .evhd{background:var(--red)}.ev-big .evhd{background:var(--purple)}

function noise(dur, vol, when, freq, type){

  var len = Math.max(1, Math.floor(c.sampleRate * dur)), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  var s = c.createBufferSource(); s.buffer = buf;
  var fl = c.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.value = freq || 2000;
  var g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t); s.stop(t + dur + 0.02);
}
function fart(){
  var c = SFX.ctx, t = c.currentTime, dur = 0.7;
  var o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(), fl = c.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(95, t); o.frequency.linearRampToValueAtTime(55, t + dur);
  lfo.frequency.value = 22; lg.gain.value = 0.25; lfo.connect(lg); lg.connect(g.gain);
  fl.type = 'lowpass'; fl.frequency.value = 420;
  g.gain.setValueAtTime(0.35, t); g.gain.linearRampToValueAtTime(0.0, t + dur);
  o.connect(fl); fl.connect(g); g.connect(c.destination);
  o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
  noise(0.5, 0.12, 0, 300);
}
function sfx(name){
  if (!SFX.on || !SFX.ctx || SFX.ctx.state !== 'running') return;
  try {
    switch (name){
      case 'dice': for (var k = 0; k < 6; k++) noise(0.035, 0.35, k * 0.075, 3000, 'bandpass'); break;
      case 'step': tone(880, 0.03, 'square', 0.025); break;
      case 'cash': tone(1318, 0.08, 'square', 0.06); tone(1760, 0.22, 'square', 0.06, 0.08); break;
      case 'womp': tone(220, 0.35, 'sawtooth', 0.08, 0, 120); break;
      case 'good': [523, 659, 784, 1047].forEach(function(f, i){ tone(f, 0.14, 'triangle', 0.14, i * 0.08); }); break;
      case 'bad': [392, 370, 349].forEach(function(f, i){ tone(f, 0.28, 'sawtooth', 0.07, i * 0.3); }); tone(330, 0.7, 'sawtooth', 0.07, 0.9, 300); break;
      case 'trombone': [392, 370, 349, 330].forEach(function(f, i){ tone(f, i === 3 ? 0.9 : 0.35, 'sawtooth', 0.08, i * 0.38, i === 3 ? 290 : 0); }); break;
      case 'fanfare': [523, 523, 523, 698, 880].forEach(function(f, i){ tone(f, i === 4 ? 0.6 : 0.13, 'square', 0.07, i < 3 ? i * 0.14 : 0.42 + (i - 3) * 0.2); }); break;
      case 'thump': tone(120, 0.16, 'sine', 0.5, 0, 50); tone(120, 0.16, 'sine', 0.5, 0.2, 50); break;
      case 'boing': tone(150, 0.4, 'sine', 0.3, 0, 620); break;
      case 'pop': tone(500, 0.07, 'sine', 0.2, 0, 1300); break;
      case 'honk': tone(440, 0.12, 'square', 0.08); tone(554, 0.12, 'square', 0.08, 0.14); tone(440, 0.12, 'square', 0.08, 0.3); break;
      case 'splat': noise(0.25, 0.5, 0, 700); tone(90, 0.15, 'sine', 0.3, 0, 40); break;
      case 'crash': noise(0.45, 0.35, 0, 1800); break;
      case 'evil': [233, 220, 196].forEach(function(f, i){ tone(f, 0.16, 'square', 0.06, i * 0.17); }); break;
      case 'fart': fart(); break;
      case 'drum': for (var q = 0; q < 16; q++) noise(0.05, 0.12 + q * 0.012, q * 0.1, 900, 'lowpass'); break;
      case 'tick': tone(1400, 0.02, 'square', 0.02); break;
      case 'land': tone(160, 0.18, 'sine', 0.45, 0, 70); noise(0.08, 0.3, 0, 1200); break;
      case 'alarm': for (var al = 0; al < 4; al++){ tone(880, 0.22, 'square', 0.07, al * 0.5, 1320); tone(1320, 0.22, 'square', 0.07, al * 0.5 + 0.25, 880); } break;
    }
  } catch(e){}
}

function present(L){
  if (!SV || SV.startedAt !== L.startedAt || !$('#board')){ buildGame(); updateGame(); return; }
  if (presenting){ pendingV = L; renderChat(L); return; }
  var diceNew = L.diceId && L.diceId !== SV.diceId;
  var movers = (L.players || []).filter(function(p){ var o = SV.players[p.i]; return o && p.moveId && p.moveId !== o.moveId && p.pos !== (tokPos[p.i] != null ? tokPos[p.i] : o.pos); });
  if (!diceNew && !movers.length){ commit(L); return; }
  presenting = true;
  var token = rid(6); presentTok = token;
  var finish = function(){
    if (presentTok !== token) return; presentTok = null;
    presenting = false;
    var n = pendingV || L; pendingV = null;
    try { commit(n === L ? L : L); } catch(e){}
    if (n !== L) present(n);
  };
  setTimeout(finish, 15000);
  var seq = diceNew ? rollDice(L.dice) : Promise.resolve();
  seq.then(function(){ return walkAll(L, movers); }).then(finish, finish);
}
var presentTok = null;
function commit(L){
  var old = SV; SV = L;
  (L.players || []).forEach(function(p){ tokPos[p.i] = p.pos; });
  moodsFromChange(old, L);
  queueEvents(old, L);
  updateGame();
}

// dice with suspense: shake, slow down, land, show the total, pause
function rollDice(d){
  return new Promise(function(done){
    var c = $('#center'), d1 = $('#d1'), d2 = $('#d2'), dice = $('#dice');
    if (!c || !d1){ done(); return; }
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    c.classList.add('rolling'); dice.classList.add('big');
    var rz = $('#rollzone'); if (rz){ rz._h = ''; rz.innerHTML = ''; }
    var old = $('.sumsticker'); if (old) old.remove();
    d1.classList.remove('dbl'); d2.classList.remove('dbl');
    d1.classList.add('rolling'); d2.classList.add('rolling');
    sfx('drum');
    var delays = reduce ? [400] : [70, 70, 70, 80, 90, 100, 115, 135, 160, 190, 230, 280, 340, 420];
    var k = 0;
    (function tickFace(){
      if (k < delays.length){
        d1.innerHTML = pipHTML(1 + Math.floor(Math.random() * 6)); d2.innerHTML = pipHTML(1 + Math.floor(Math.random() * 6));
        sfx('tick');
        setTimeout(tickFace, delays[k++]); return;
      }
      d1.classList.remove('rolling'); d2.classList.remove('rolling');
      d1.innerHTML = pipHTML(d[0]); d2.innerHTML = pipHTML(d[1]);
      d1.classList.add('land'); d2.classList.add('land');
      setTimeout(function(){ d1.classList.remove('land'); d2.classList.remove('land'); }, 400);
      var dbl = d[0] === d[1];
      d1.classList.toggle('dbl', dbl); d2.classList.toggle('dbl', dbl);
      var st = document.createElement('div'); st.className = 'sumsticker';
      st.innerHTML = '<b>' + (d[0] + d[1]) + '</b>' + (dbl ? '<span>Iguais! Joga de novo</span>' : '');
      dice.appendChild(st);
      sfx(dbl ? 'good' : 'land');
      setTimeout(function(){
        c.classList.remove('rolling'); dice.classList.remove('big');
        setTimeout(function(){ st.remove(); }, 1800);
        done();
      }, reduce ? 300 : 1100);
    })();
  });
}

function walkAll(L, movers){
  var p = Promise.resolve();
  movers.forEach(function(m){ p = p.then(function(){ return walkOne(L, m); }); });
  return p;
}
function walkOne(L, p){
  return new Promise(function(done){
    var o = SV.players[p.i];
    var from = tokPos[p.i] != null ? tokPos[p.i] : o.pos, to = p.pos;
    var fwd = (to - from + 40) % 40, back = (from - to + 40) % 40;
    var dir = p.moveSteps < 0 ? -1 : 1, steps = dir > 0 ? fwd : back;
    var tok = $('#tok-' + p.i);
    if (!steps){ done(); return; }
    if (steps > 14 || !p.moveSteps){
      if (tok) tok.classList.add('poof');
      setTimeout(function(){ tokPos[p.i] = to; placeTokens(false); if (tok) tok.classList.remove('poof'); sfx('pop'); setTimeout(done, 350); }, 350);
      return;
    }
    var k = 0, passed = {};
    if (tok){ tok.classList.add('walk'); tok.dataset.mood = 'ok'; }
    var iv = setInterval(function(){
      k++; tokPos[p.i] = ((from + dir * k) % 40 + 40) % 40; placeTokens(false); sfx('step');
      if (tok){ tok.classList.remove('hop'); void tok.offsetWidth; tok.classList.add('hop'); }
      if (k < steps) overtake(p.i, tokPos[p.i], passed);
      if (k >= steps){
        clearInterval(iv);
        if (tok){ tok.classList.remove('walk', 'hop'); tok.classList.add('land'); setTimeout(function(){ tok.classList.remove('land'); }, 420); }
        setTimeout(done, 380);
      }
    }, BL.STEP_MS);
  });
}

// event cards in the middle of the board
function queueEvents(old, L){
  var cardId = old && old.card ? old.card.id : null;
  var newCard = L.card && L.card.id !== cardId ? L.card : null;
  var lastPlain = null;
  (L.log || []).forEach(function(l){
    if (seenLog[l.id]) return; seenLog[l.id] = 1;
    if (/^(🍀|🩸)/.test(l.text)){ if (newCard){ evQ.push({ card: newCard, players: L.players }); newCard = null; } return; }
    if (l.k === 'big' || l.k === 'bad' || l.k === 'good') evQ.push({ kind: l.k, text: l.text });
    else lastPlain = l.text;
  });
  if (newCard) evQ.push({ card: newCard, players: L.players });
  if (lastPlain){ var n = $('#narr'); if (n){ n.className = 'narr'; n.textContent = lastPlain; } }
  if (!evShowing) showNextEvent();
}

function updateTimers(){
  var V = view(); if (!V || V.phase !== 'game') return;
  var now = Date.now() + (N.mode === 'online' && !N.isHost ? N.offset : 0);
  var left = Math.max(0, V.endsAt - now);
  var gt = $('#gtimer');
  if (gt){ var m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60; gt.textContent = m + ':' + (s < 10 ? '0' : '') + s; var tw = $('#tower'); if (tw) tw.classList.toggle('low', left < 60000); }
  var tb = $('#tbar');
  if (tb && V.pending){
    var total = V.pending.kind === 'tribunal' ? 30000 : BL.TURN_MS;
    var end = V.pending.kind === 'tribunal' && V.tribunal ? V.tribunal.endsAt : Math.max(V.pending.since, V.busyUntil || 0) + total;
    var frac = Math.max(0, Math.min(1, (end - now) / total));
    tb.firstChild.style.width = (frac * 100) + '%';
    tb.classList.toggle('hurry', frac < 0.25);
  }
}
